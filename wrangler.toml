name = "autoshitje"
main = "src/index.js"
compatibility_date = "2026-10-19"

[assets]
directory = "./public"
binding = "ASSETS"

# Replace database_id with the UUID displayed under D1 > autoshitje-db > Settings.
[[d1_databases]]
binding = "DB"
database_name = "autoshitje-db"
database_id = "fd62c854-fe92-48a2-aecc-4e8bb3443eaa"

# Optional: Create an R2 bucket named autoshitje-photos, then uncomment:
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "autoshitje-photos"
