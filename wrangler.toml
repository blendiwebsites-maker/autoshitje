name = "autoshitje"
main = "src/index.js"
compatibility_date = "2026-10-19"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/autosallon/*", "/vetura/*", "/veturat", "/veturat/", "/autosallonet", "/autosallonet/", "/llogaria", "/llogaria/", "/paneli", "/paneli/", "/shpall", "/shpall/", "/favoritet", "/favoritet/"]

[[d1_databases]]
binding = "DB"
database_name = "autoshitje-db"
database_id = "fd62c854-fe92-48a2-aecc-4e8bb3443eaa"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "autoshitje-photos"

[observability.logs]
enabled = true
invocation_logs = true
