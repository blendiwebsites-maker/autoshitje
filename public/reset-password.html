<!doctype html><html lang="sq"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rikthe fjalëkalimin – AutoShitje</title><style>body{background:#0b0c10;color:white;font:18px system-ui;margin:40px auto;max-width:480px;padding:20px}input,button{box-sizing:border-box;width:100%;padding:15px;margin:10px 0;border-radius:10px}button{background:#e51e32;color:white;border:0}</style><img src="/logo.svg" width="190" alt="AutoShitje"><h1>Fjalëkalimi i ri</h1><form><input type="password" minlength="12" required placeholder="Minimumi 12 karaktere"><button>Ruaj fjalëkalimin</button></form><p id="msg"></p><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:new URLSearchParams(location.search).get('token'),password:document.querySelector('input').value})});const j=await r.json();document.querySelector('#msg').textContent=r.ok?'Fjalëkalimi u ndryshua. Tani mund të kyçesh.':j.error||'Gabim';};</script></html>
