<!doctype html><html lang="sq"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin – AutoShitje</title><style>body{background:#0b0c10;color:#f8f8f8;font:16px system-ui;margin:auto;max-width:1100px;padding:24px}button{background:#e51e32;color:white;border:0;border-radius:8px;padding:10px;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #333;text-align:left}section{overflow:auto;margin:28px 0}a{color:#ff6778}</style><img src="/logo.svg" width="190" alt="AutoShitje"><h1>Paneli Admin</h1><p id="status">Duke kontrolluar autorizimin...</p><div id="app" hidden><h2 id="summary"></h2><section><h2>Përdoruesit</h2><table id="users"></table></section><section><h2>Shpalljet</h2><table id="cars"></table></section><section><h2>Autosallonet e dalluara</h2><p>Zgjedh autosallonet që shfaqen në ballinë.</p><div id="featured-dealers"></div></section><section><h2>Kërkesat për fshirjen e llogarisë</h2><div id="deletion-requests"></div></section></div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,o){const r=await fetch(p,o);const j=await r.json();if(!r.ok)throw Error(j.error||'Gabim');return j}
async function load(){try{const [summary,users,cars]=await Promise.all(['/api/admin/summary','/api/admin/users','/api/admin/cars'].map(p=>api(p)));document.querySelector('#status').textContent='Kyçur si administrator';await loadExtras();document.querySelector('#app').hidden=false;document.querySelector('#summary').textContent=`${summary.users} përdorues · ${summary.cars} shpallje · ${summary.dealers} autosallone`;document.querySelector('#users').innerHTML='<tr><th>Emri</th><th>Email</th><th>Roli</th></tr>'+users.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td></tr>`).join('');document.querySelector('#cars').innerHTML='<tr><th>Vetura</th><th>Shitësi</th><th>Statusi</th><th>Veprimi</th></tr>'+cars.cars.map(c=>`<tr><td>${esc(c.brand)} ${esc(c.model)}</td><td>${esc(c.email)}</td><td>${esc(c.status)}</td><td><button data-id="${esc(c.id)}" data-status="${c.status==='active'?'deleted':'active'}">${c.status==='active'?'Çaktivizo':'Aktivizo'}</button></td></tr>`).join('');document.querySelectorAll('button[data-id]').forEach(b=>b.onclick=async()=>{if(!confirm('Konfirmo ndryshimin e statusit?'))return;try{await api('/api/admin/cars/'+b.dataset.id+'/status',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({status:b.dataset.status})});load()}catch(e){alert(e.message)}})}catch(e){document.querySelector('#status').textContent=e.message+' — Kyçu me llogarinë Admin në faqen kryesore.'}}async function loadExtras(){try{
 const [d,r]=await Promise.all([api('/api/admin/dealers'),api('/api/admin/delete-requests')]);
 document.querySelector('#featured-dealers').innerHTML=d.dealers.map(x=>`<p><label><input type="checkbox" data-featured="${esc(x.id)}" ${x.featured?'checked':''}> ${esc(x.name)}</label></p>`).join('')||'Nuk ka autosallone.';
 document.querySelectorAll('[data-featured]').forEach(x=>x.onchange=async()=>{try{await api('/api/admin/dealers/featured',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:x.dataset.featured,featured:x.checked})})}catch(e){alert(e.message);x.checked=!x.checked}});
 document.querySelector('#deletion-requests').innerHTML=r.requests.map(x=>`<p>${esc(x.name)} — ${esc(x.email)} (${esc(x.created_at)})</p>`).join('')||'Nuk ka kërkesa.';
 }catch(e){document.querySelector('#featured-dealers').textContent=e.message}}
load();</script></html>
